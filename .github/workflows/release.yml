name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  maven-central:
    name: Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Set version from tag
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Publish the starter
        run: mvn -B -ntp -P release deploy -pl leapwire-spring-boot-starter -am
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Collect signed artifacts
        run: |
          mkdir -p release
          cp leapwire-spring-boot-starter/target/leapwire-spring-boot-starter-*.jar leapwire-spring-boot-starter/target/leapwire-spring-boot-starter-*.asc release/
          version="${GITHUB_REF_NAME#v}"
          cp leapwire-spring-boot-starter/pom.xml "release/leapwire-spring-boot-starter-$version.pom"
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release/*.jar
      - name: Attach the provenance bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" release/leapwire-maven.intoto.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: maven-artifacts
          path: release/

  npm:
    name: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Set version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version -w leapwire
      - run: npm run build
      - name: Pack
        run: |
          mkdir -p ../release
          npm pack -w leapwire --pack-destination ../release
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: release/*.tgz
      - name: Attach the provenance bundle
        run: cp "${{ steps.attest.outputs.bundle-path }}" ../release/leapwire-npm.intoto.jsonl
      - name: Publish with provenance
        run: npm publish ../release/leapwire-*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-package
          path: release/

  github-release:
    name: GitHub Release
    needs: [maven-central, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: release
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp LICENSE release/LICENSE
          (cd release && sha256sum * > SHA256SUMS.txt)
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" release/* --title "Leapwire $version" --notes-file notes.md --verify-tag
